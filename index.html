<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06080c" />
    <meta name="description" content="תפילה · tfila — מכשיר תלת־ממדי שמראה איך בנוי עולם התפילה: מסלולי תפילה, טקסטים ממקורות פתוחים, ונוסחי עדות המזרח, אשכנז, ספרד, חב״ד ותימן." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>תפילה · TFILA — סולם התפילות</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05070a; }
      #loader { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center;
        background: radial-gradient(1200px 700px at 45% 45%, #121826 0%, #06080c 60%, #030406 100%);
        font-family: system-ui, sans-serif; color: #9aa6b8; transition: opacity .9s ease, visibility .9s; }
      #loader.done { opacity: 0; visibility: hidden; }
    </style>
  </head>
  <body>
    <a class="skip" href="#libraryView" id="skipLink">דלגו לספריית התפילות (תצוגת טקסט)</a>

    <div id="app">
      <canvas id="gl" tabindex="0" role="application"
        aria-label="סולם התפילות: סולם תלת־ממדי של תפילות בארבעה עולמות. גררו או השתמשו בחצים כדי להקיף ולטפס, גלגלת או פלוס ומינוס להתקרבות, Enter לבחירת התפילה שבמרכז."></canvas>
      <div class="labels" id="labels" aria-hidden="true"></div>
    </div>

    <div id="ui">
      <header class="topbar">
        <div class="brand">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="32" cy="32" r="29" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1.6" />
            <path d="M22 56 C14 46 50 40 42 30 C34 20 18 22 26 8" fill="none" stroke="rgba(159,240,255,.6)" stroke-width="1.4" />
            <path d="M30 56 C22 46 58 40 50 30 C42 20 26 22 34 8" fill="none" stroke="rgba(159,240,255,.6)" stroke-width="1.4" />
            <path d="M24 50h8M27 44h9M33 39h9M39 33h8M38 27h8M33 22h8M28 17h8M27 12h7" stroke="rgba(255,255,255,.45)" stroke-width="1.1" />
            <circle cx="30" cy="7" r="3" fill="#fff3cf" /><circle cx="37" cy="36" r="2" fill="#5fe0ff" /><circle cx="30" cy="48" r="1.8" fill="#ffb547" />
          </svg>
          <div>
            <h1>TFILA<span>תפילה</span></h1>
            <p>סולם התפילות — מסלולים, נוסחים וטקסטים</p>
          </div>
        </div>

        <nav class="chip" aria-label="תצוגות">
          <div class="seg" role="tablist" id="tabs">
            <button role="tab" data-tab="world" aria-selected="true">מעבדה</button>
            <button role="tab" data-tab="library" aria-selected="false">ספרייה</button>
            <button role="tab" data-tab="compare" aria-selected="false">השוואה</button>
            <button role="tab" data-tab="learn" aria-selected="false">למדו</button>
          </div>
        </nav>

        <div class="top-actions">
          <div class="search" role="search">
            <label for="q" class="sr-only">חיפוש תפילה או מילים</label>
            <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="חיפוש — עם ניקוד או בלעדיו" aria-controls="results" aria-expanded="false" />
            <kbd aria-hidden="true">/</kbd>
            <div class="results" id="results" role="listbox" aria-label="תוצאות חיפוש" hidden></div>
          </div>
          <div class="chip" id="qualityChip" title="איכות הרינדור">
            <div class="seg" id="quality" role="group" aria-label="איכות רינדור">
              <button data-q="auto" aria-pressed="true">אוטו׳</button>
              <button data-q="low" aria-pressed="false">נמוכה</button>
              <button data-q="medium" aria-pressed="false">בינונית</button>
              <button data-q="high" aria-pressed="false">גבוהה</button>
            </div>
          </div>
          <button class="icon-btn" id="motionBtn" aria-pressed="false" title="הפחתת תנועה">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
            <span class="sr-only">הפחתת תנועה</span>
          </button>
          <button class="icon-btn" id="helpBtn" title="עזרה וקיצורי מקלדת">?</button>
        </div>
      </header>

      <nav class="crumbs chip" id="crumbs" aria-label="מיקום וחזרה" hidden></nav>
      <section class="panel explain" id="explain" aria-live="polite"></section>
      <section class="panel readouts" id="readouts" aria-label="מדדים"></section>

      <div class="live" id="live" role="button" tabindex="0" aria-label="תצוגה חיה של מילות התפילה — פתיחת הקורא">
        <div class="perf top"></div><div class="perf bottom"></div>
        <span class="edge">TFILA · 154</span>
        <div class="frame" id="liveFrame"></div>
        <span class="caption">מבט מקרוב</span>
      </div>

      <div class="dock" id="dock" aria-label="לוח בקרה"></div>
      <div class="tooltip" id="tooltip" hidden></div>
    </div>

    <div class="sheet-wrap" id="reader" hidden>
      <div class="panel sheet" role="dialog" aria-modal="true" aria-labelledby="readerTitle" id="readerSheet"></div>
    </div>

    <main class="view" id="libraryView" tabindex="-1" hidden aria-label="ספריית התפילות"></main>
    <main class="view" id="compareView" tabindex="-1" hidden aria-label="השוואת נוסחים"></main>
    <main class="view" id="learnView" tabindex="-1" hidden aria-label="למדו"></main>

    <div class="modal" id="help" hidden><div class="panel help" role="dialog" aria-modal="true" aria-labelledby="helpTitle" id="helpPanel"></div></div>
    <div id="sr" class="sr-only" aria-live="polite"></div>

    <div id="loader" role="status" aria-live="polite">
      <div class="loader-inner">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="29" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="2" />
          <ellipse cx="32" cy="32" rx="12" ry="29" fill="none" stroke="rgba(159,240,255,.7)" stroke-width="1.2" />
          <path d="M3 32h58" stroke="rgba(159,240,255,.5)" stroke-width="1" />
          <circle cx="40" cy="22" r="3" fill="#5fe0ff" />
        </svg>
        <div class="loader-title">TFILA</div>
        <div class="loader-sub" id="loaderSub">מכיילים את המכשיר ופורשים את עולם התפילות…</div>
        <button class="btn" id="retry" hidden>לנסות שוב</button>
      </div>
    </div>
    <noscript>תפילה צריכה JavaScript. תצוגת הטקסט זמינה כשהסקריפטים פועלים גם בלי WebGL.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
